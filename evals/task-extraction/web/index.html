<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task extraction · Eval studio</title><link rel="stylesheet" href="/style.css"></head><body><header><div><span class="eyebrow">DOOTOO / LOCAL LAB</span><h1>Eval studio<span class="dot">●</span></h1></div><span id="connection">Connecting…</span></header><main><aside><nav class="studio-nav" aria-label="Studio views"><button id="nav-home">Dashboard</button><button id="nav-experiment">New experiment</button><button id="nav-history">Run history</button><button id="nav-prompts">Prompt History</button><button id="nav-models">Model History</button></nav><section id="experiment-panel" hidden><h2>New experiment</h2><form id="new-run"><label>Run label<input name="label" value="experiment" required pattern="[\w-]+"></label><label>Provider<select name="provider" required></select></label><label>Model<select name="model" required></select></label><p id="model-readiness" class="muted"></p><label>Prompt version<select name="promptVersion" required></select></label><div class="pair"><label>Repeats<input name="repeats" type="number" min="1" max="100" value="1"></label><label>Concurrency<input name="concurrency" type="number" min="1" max="100" value="2"></label></div><label>Case<select name="case"><option value="">All cases</option></select></label><label>Category<select name="tag"><option value="">All categories</option></select></label><label>Baseline for this live run (optional)<select name="baseline"><option value="">No baseline</option></select></label><p id="estimate" class="muted"></p><button id="launch">Start live run</button><p class="muted">Live runs use the selected provider API key and incur API usage.</p></form></section></aside><article><div id="notice" role="status"></div><div id="workspace"><div class="empty"><span class="eyebrow">EXPERIMENT → REVIEW → COMPARE</span><h2>A clearer view of every extraction.</h2><p>Start an experiment or open a saved run to review task meaning, scheduling and hierarchy.</p></div></div></article></main><script src="/app.js" type="module"></script></body></html>
